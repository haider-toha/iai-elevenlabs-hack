[project]
name = "hackathon-backend"
version = "0.1.0"
description = "Hackathon FastAPI backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"
authors = [{ name = "i.AI Hackathon" }]
dependencies = [
    "fastapi>=0.138,<0.139",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "uvicorn>=0.49,<0.50",
    "asyncpg>=0.30,<0.31",
]

[tool.poetry]
# Only what PEP 621 cannot express: our package lives in app/, not a dir
# matching the project name.
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
httpx = ">=0.28,<0.29"
ruff = ">=0.15,<0.16"
mypy = ">=2.1,<3"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces black/isort/flake8)
# https://docs.astral.sh/ruff/configuration/
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict
# https://mypy.readthedocs.io/en/stable/config_file.html
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
